<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #57606a; }
      .m { font-size: 11.5px; fill: #57606a; font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .band { font-size: 12px; font-weight: 700; fill: #57606a; letter-spacing: 1px; }
      .a { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .neutral { fill: #ffffff; stroke: #8c959f; }
      .data { fill: #e8f1fb; stroke: #3b7dd8; }
      .claude { fill: #fbede5; stroke: #d97757; }
      .guard { fill: #e9f6ee; stroke: #2f9e5b; }
      .report { fill: #f1ecfb; stroke: #8250df; }
      rect.box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="560" rx="16" fill="#ffffff"/>

  <!-- 1. Setup -->
  <rect x="16" y="16" width="1068" height="124" rx="12" fill="#f6f8fa"/>
  <text class="band" x="40" y="44">1 · SETUP (RUN ONCE)</text>
  <rect class="box data" x="40" y="62" width="250" height="58" rx="10"/>
  <text class="t" x="165" y="87" text-anchor="middle">US housing data</text>
  <text class="s" x="165" y="106" text-anchor="middle">Census + Freddie Mac, via FRED</text>
  <rect class="box neutral" x="350" y="62" width="220" height="58" rx="10"/>
  <text class="t" x="460" y="87" text-anchor="middle">load_data.py</text>
  <text class="s" x="460" y="106" text-anchor="middle">download + clean</text>
  <rect class="box data" x="630" y="62" width="250" height="58" rx="10"/>
  <text class="t" x="755" y="87" text-anchor="middle">housing.duckdb</text>
  <text class="s" x="755" y="106" text-anchor="middle">5 tables, 2000 to latest month</text>
  <path class="a" d="M294,91 H346"/>
  <path class="a" d="M574,91 H626"/>

  <!-- 2. Ask -->
  <rect x="16" y="156" width="1068" height="230" rx="12" fill="#f6f8fa"/>
  <text class="band" x="40" y="184">2 · ASK A QUESTION (ask.py / api.py)</text>

  <rect class="box neutral" x="40" y="222" width="180" height="70" rx="10"/>
  <text class="t" x="130" y="250" text-anchor="middle">Your question</text>
  <text class="s" x="130" y="270" text-anchor="middle">"Avg mortgage rate</text>
  <text class="s" x="130" y="285" text-anchor="middle">in 2023?"</text>

  <rect class="box claude" x="250" y="222" width="200" height="70" rx="10"/>
  <text class="t" x="350" y="250" text-anchor="middle">Claude writes SQL</text>
  <text class="s" x="350" y="268" text-anchor="middle">structured output</text>
  <text class="m" x="350" y="284" text-anchor="middle">{can_answer, sql, note}</text>

  <rect class="box guard" x="480" y="222" width="170" height="70" rx="10"/>
  <text class="t" x="565" y="250" text-anchor="middle">Safety check</text>
  <text class="s" x="565" y="270" text-anchor="middle">read-only database,</text>
  <text class="s" x="565" y="285" text-anchor="middle">SELECT only</text>

  <rect class="box data" x="680" y="222" width="160" height="70" rx="10"/>
  <text class="t" x="760" y="250" text-anchor="middle">DuckDB runs it</text>
  <text class="s" x="760" y="270" text-anchor="middle">returns the rows</text>

  <rect class="box claude" x="870" y="222" width="190" height="70" rx="10"/>
  <text class="t" x="965" y="250" text-anchor="middle">Claude explains</text>
  <text class="s" x="965" y="270" text-anchor="middle">plain-English answer</text>

  <path class="a" d="M224,257 H246"/>
  <path class="a" d="M454,257 H476"/>
  <path class="a" d="M654,257 H676"/>
  <path class="a" d="M844,257 H866"/>

  <!-- retry loop -->
  <path class="a" d="M760,218 V202 H380 V218" stroke-dasharray="5 4"/>
  <text class="s" x="570" y="197" text-anchor="middle" font-style="italic">query error → Claude fixes it (1 retry)</text>

  <!-- decline + output -->
  <rect class="box neutral" x="250" y="318" width="200" height="54" rx="10" stroke-dasharray="5 4"/>
  <text class="t" x="350" y="341" text-anchor="middle">Declines politely</text>
  <text class="s" x="350" y="359" text-anchor="middle">if the data can't answer</text>
  <path class="a" d="M350,296 V314"/>

  <rect class="box report" x="870" y="318" width="190" height="54" rx="10"/>
  <text class="t" x="965" y="341" text-anchor="middle">Answer + SQL + table</text>
  <text class="s" x="965" y="359" text-anchor="middle">+ time, tokens, cost</text>
  <path class="a" d="M965,296 V314"/>

  <!-- 3. Evaluate -->
  <rect x="16" y="402" width="1068" height="142" rx="12" fill="#f6f8fa"/>
  <text class="band" x="40" y="430">3 · EVALUATE (run_eval.py)</text>

  <rect class="box neutral" x="40" y="450" width="230" height="74" rx="10"/>
  <text class="t" x="155" y="478" text-anchor="middle">16 test questions</text>
  <text class="s" x="155" y="497" text-anchor="middle">14 with a known answer</text>
  <text class="s" x="155" y="512" text-anchor="middle">+ 2 trap questions</text>

  <rect class="box claude" x="320" y="450" width="230" height="74" rx="10"/>
  <text class="t" x="435" y="478" text-anchor="middle">Agent answers</text>
  <text class="s" x="435" y="497" text-anchor="middle">same pipeline as step 2</text>

  <rect class="box guard" x="600" y="450" width="230" height="74" rx="10"/>
  <text class="t" x="715" y="478" text-anchor="middle">Compare results</text>
  <text class="s" x="715" y="497" text-anchor="middle">agent's rows vs</text>
  <text class="s" x="715" y="512" text-anchor="middle">reference rows</text>

  <rect class="box report" x="870" y="450" width="190" height="74" rx="10"/>
  <text class="t" x="965" y="478" text-anchor="middle">Scorecard</text>
  <text class="s" x="965" y="497" text-anchor="middle">accuracy · latency · cost</text>
  <text class="m" x="965" y="513" text-anchor="middle">16/16 · 3.3s · $0.11</text>

  <path class="a" d="M274,487 H316"/>
  <path class="a" d="M554,487 H596"/>
  <path class="a" d="M834,487 H866"/>
</svg>
